<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <title>SMS Gateway</title>
    <style>
        :root {
            --bg: #f6f7f9;
            --panel: #fff;
            --text: #16202a;
            --muted: #607080;
            --line: #d9e0e7;
            --accent: #0b6bcb;
            --ok: #0f7b4f;
            --warn: #b45309;
            --bad: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "Noto Sans SC", sans-serif;
            font-size: 16px;
            line-height: 1.5;
        }

        main {
            width: min(760px, 100%);
            margin: 0 auto;
            padding: 24px;
        }

        header {
            padding: 10px 0 18px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            font-weight: 700;
            letter-spacing: 0;
        }

        h2 {
            margin: 0 0 14px;
            font-size: 18px;
            line-height: 1.3;
        }

        .sub {
            margin: 6px 0 0;
            color: var(--muted);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 18px;
            margin: 14px 0;
            box-shadow: 0 1px 2px rgba(16, 24, 40, .04);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .item {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            background: #fbfcfd;
            min-width: 0;
        }

        .label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            margin-bottom: 4px;
        }

        .value {
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 3px 10px;
            border-radius: 999px;
            background: #eef4ff;
            color: #1849a9;
            font-weight: 650;
        }

        .pill.ok {
            background: #e8f6ef;
            color: var(--ok);
        }

        .pill.bad {
            background: #fff1f0;
            color: var(--bad);
        }

        .pill.warn {
            background: #fff7ed;
            color: var(--warn);
        }

        form {
            margin: 0;
        }

        label {
            display: block;
            margin: 14px 0 6px;
            font-weight: 650;
        }

        input {
            width: 100%;
            min-height: 44px;
            border: 1px solid #c8d2dc;
            border-radius: 8px;
            padding: 10px 12px;
            background: #fff;
            color: var(--text);
            font: inherit;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(11, 107, 203, .14);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .hidden {
            display: none !important;
        }

        button {
            min-height: 42px;
            border: 1px solid transparent;
            border-radius: 8px;
            padding: 9px 14px;
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        button.primary {
            background: var(--accent);
            color: #fff;
        }

        a.button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            border-radius: 8px;
            padding: 9px 14px;
            background: var(--accent);
            color: #fff;
            font-weight: 650;
            text-decoration: none;
        }

        button.secondary {
            background: #fff;
            border-color: #c8d2dc;
            color: #27364a;
        }

        button:disabled {
            opacity: .65;
            cursor: not-allowed;
        }

        .msg {
            margin-top: 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 12px;
            background: #fbfcfd;
            min-height: 46px;
            overflow-wrap: anywhere;
        }

        .msg.ok {
            border-color: #a7dbc1;
            background: #eefaf4;
            color: #075e3d;
        }

        .msg.bad {
            border-color: #f4b5ad;
            background: #fff5f4;
            color: #9f1d13;
        }

        .msg.warn {
            border-color: #f7c98b;
            background: #fff8ed;
            color: #8a3f00;
        }

        a {
            color: var(--accent);
            font-weight: 650;
        }

        @media (max-width: 560px) {
            main {
                padding: 18px 14px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>SMS Gateway</h1>
            <p class="sub">Wi-Fi 配网与设备状态</p>
        </header>

        <section class="panel" aria-labelledby="statusTitle">
            <h2 id="statusTitle">当前状态</h2>
            <div class="grid">
                <div class="item">
                    <span class="label">模式</span>
                    <span id="mode" class="pill warn">读取中</span>
                </div>
                <div class="item">
                    <span class="label">STA 连接</span>
                    <span id="staConnected" class="pill warn">读取中</span>
                </div>
                <div class="item">
                    <span class="label">STA IP</span>
                    <span id="staIp" class="value">-</span>
                </div>
                <div class="item">
                    <span class="label">SoftAP</span>
                    <span id="apEnabled" class="pill warn">读取中</span>
                </div>
            </div>
        </section>

        <section class="panel" aria-labelledby="wifiTitle">
            <h2 id="wifiTitle">Wi-Fi 配置</h2>
            <form id="wifiForm" autocomplete="on">
                <label for="ssid">SSID</label>
                <input id="ssid" name="ssid" maxlength="32" autocomplete="off" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password" maxlength="64" autocomplete="current-password" required>

                <div class="actions">
                    <button id="connectBtn" class="primary" type="submit">连接 Wi-Fi</button>
                </div>
            </form>
            <div id="message" class="msg" role="status" aria-live="polite">等待操作</div>
            <div id="redirectActions" class="actions hidden">
                <a id="switchedLink" class="button" href="#">已切换</a>
            </div>
        </section>
    </main>

    <script>
        const $ = id => document.getElementById(id);
        let redirectUrl = '';
        let waitingForNetworkSwitch = false;
        let statusTimer = null;

        function setPill(el, text, cls) {
            el.className = 'pill ' + cls;
            el.textContent = text;
        }

        function setMessage(text, cls) {
            const message = $('message');
            message.className = 'msg ' + (cls || '');
            message.innerHTML = text;
        }

        function setRedirectAction(url) {
            redirectUrl = url || '';
            $('switchedLink').href = redirectUrl || '#';
            $('redirectActions').classList.toggle('hidden', !redirectUrl);
        }

        async function loadStatus() {
            try {
                const response = await fetch('/api/status', {cache: 'no-store'});
                const status = await response.json();

                setPill(
                    $('mode'),
                    status.mode === 'config' ? '配网模式' : 'STA 模式',
                    status.mode === 'config' ? 'warn' : 'ok'
                );
                setPill(
                    $('staConnected'),
                    status.sta_connected ? '已连接' : '未连接',
                    status.sta_connected ? 'ok' : 'bad'
                );
                $('staIp').textContent = status.sta_ip || '-';
                setPill(
                    $('apEnabled'),
                    status.ap_enabled ? '已开启' : '已关闭',
                    status.ap_enabled ? 'warn' : 'ok'
                );
            } catch (err) {
                if (!waitingForNetworkSwitch) {
                    setMessage('状态读取失败：' + err, 'bad');
                }
            }
        }

        document.getElementById('wifiForm').addEventListener('submit', async event => {
            event.preventDefault();

            const button = $('connectBtn');
            button.disabled = true;
            setRedirectAction('');
            setMessage('正在连接，请稍候', 'warn');

            const body = new URLSearchParams(new FormData(event.target));
            try {
                const response = await fetch('/api/wifi_config', {method: 'POST', body});
                const result = await response.json();

                if (result.ok) {
                    const url = 'http://' + result.ip;
                    waitingForNetworkSwitch = true;
                    if (statusTimer) {
                        clearInterval(statusTimer);
                        statusTimer = null;
                    }
                    setMessage(
                        'Wi-Fi 已连接，设备热点将自动关闭。请切换到家庭 Wi-Fi，完成后点击“已切换”进入 <a href="' + url + '">' + url + '</a>',
                        'ok'
                    );
                    setRedirectAction(url);
                } else {
                    waitingForNetworkSwitch = false;
                    setMessage('连接失败，请检查 Wi-Fi 名称和密码：' + result.message, 'bad');
                }
            } catch (err) {
                waitingForNetworkSwitch = false;
                setMessage('请求失败：' + err, 'bad');
            } finally {
                button.disabled = waitingForNetworkSwitch;
            }

            if (!waitingForNetworkSwitch) {
                loadStatus();
            }
        });

        loadStatus();
        statusTimer = setInterval(loadStatus, 5000);
    </script>
</body>
</html>
